<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Now playing example</title>
  <style>
    body { margin: 0; padding: 40px 16px; font-family: system-ui, sans-serif; background: #f5f5f7; color: #1d1d1f; }
    @media (prefers-color-scheme: dark) { body { background: #000; color: #f5f5f7; } }
    main { max-width: 600px; margin: 0 auto; }
  </style>
</head>
<body>
  <main>
    <h1>Hi, I'm ...</h1>
    <p>Here's what I'm listening to right now:</p>

    <!-- the card appears here -->
    <div data-now-playing></div>
  </main>

  <!-- change data-endpoint to your own worker URL (it's the worker_url in config.json after you run deploy.py) -->
  <script src="now-playing.js" data-endpoint="https://nowplaying.YOUR-NAME.workers.dev" defer></script>
</body>
</html>
